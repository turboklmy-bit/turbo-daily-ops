<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Turbo Daily Ops 每日负责人安排 - Admin URL Login v4</title>
  <style>
    :root{--bg:#f6f6f6;--card:#fff;--text:#171717;--muted:#737373;--line:#dedede;--black:#111;--red:#991b1b;--redbg:#fee2e2;--green:#166534;--greenbg:#dcfce7;--yellow:#854d0e;--yellowbg:#fef3c7;--blue:#1d4ed8;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif} button,input,select,textarea{font:inherit} .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}.tabs{position:sticky;top:0;background:rgba(246,246,246,.94);backdrop-filter:blur(10px);z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 0}.tab{border:0;border-radius:18px;background:#eee;padding:14px 10px;font-weight:800;color:#444}.tab.active{background:#111;color:#fff}.title{font-size:36px;line-height:1.05;font-weight:950;margin:28px 0 8px}.sub{color:var(--muted);font-size:18px;margin-bottom:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin:14px 0;box-shadow:0 1px 1px rgba(0,0,0,.02)}.label{color:var(--muted);font-size:15px;margin-bottom:8px}.big{font-size:28px;font-weight:950}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{font-size:25px;font-weight:950;margin:30px 0 14px}.pill,.day,.smallBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 18px;font-weight:850}.pill.absent{background:var(--redbg);color:var(--red);border-color:#fecaca}.pill.fixed{background:var(--redbg);color:var(--red);border-color:#fecaca}.day.active,.smallBtn.active{background:#111;color:#fff}.roleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.roleTitle{font-size:22px;font-weight:950}.reminder{background:var(--yellowbg);color:var(--yellow);border-radius:18px;padding:14px 16px;line-height:1.5;margin:14px 0}.mainPerson{background:#111;color:#fff;border-radius:22px;padding:18px 20px;margin:14px 0}.mainPerson .name{font-size:42px;font-weight:950}.listItem{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;background:#fff;display:flex;justify-content:space-between;align-items:center}.badge{font-size:13px;background:var(--greenbg);color:var(--green);padding:6px 10px;border-radius:999px;font-weight:800}.input{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.btn{border:0;border-radius:16px;background:#111;color:#fff;font-weight:900;padding:13px 18px}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.green{background:#dcfce7;color:#166534}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.notice{border-radius:18px;padding:14px 16px;margin:12px 0;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.error{background:#fee2e2;color:#991b1b;border-color:#fecaca}.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}.adminBox{border:1px solid var(--line);background:#fff;border-radius:24px;padding:18px;margin:14px 0}.muted{color:var(--muted)}.prioCard{border:1px solid var(--line);border-radius:22px;background:#fff;padding:16px;margin:12px 0}.priorityRow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;border-top:1px solid #f1f1f1;padding:9px 0}.priorityRow:first-of-type{border-top:0}.hidden{display:none!important}@media(max-width:640px){.title{font-size:31px}.big{font-size:24px}.wrap{padding-left:14px;padding-right:14px}.tabs{gap:8px}.tab{font-size:15px;padding:12px 6px}.grid2{grid-template-columns:1fr}.mainPerson .name{font-size:38px}.priorityRow{grid-template-columns:auto 1fr auto auto auto}.btn{padding:11px 13px}.pill,.day{padding:10px 14px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tabs"><button class="tab active" data-tab="today">今日安排</button><button class="tab" data-tab="me">我的身份</button><button class="tab" data-tab="admin">Admin 设置</button></div>
    <div id="status" class="notice">正在连接 Supabase...</div>
    <main id="app"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wwjgazaylhtnzawlofmy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wDCGxWePLoZRLe0oRquorg_YoFa07uo";
    const TABLE = "ops_settings";
    const APP_VERSION = "admin-url-login-v4";
    const ID = 1;
    const days = [{key:'mon',label:'星期一'},{key:'tue',label:'星期二'},{key:'wed',label:'星期三'},{key:'thu',label:'星期四'},{key:'fri',label:'星期五'},{key:'sat',label:'星期六'},{key:'sun',label:'星期日'}];
    const roleMeta = {
      billing:{title:'开单',reminder:'每小时检查一次，2:00 PM 后停止；6:00 PM 最后一次检查。'},
      instant:{title:'包货 Instant',reminder:'每小时检查一次，2:00 PM 后停止；6:00 PM 最后一次检查。'},
      normal:{title:'包货 Normal'},
      packingVideo:{title:'Packing Video 检查'},
      packingList:{title:'Packing List 检查'},
      delivery:{title:'送货人员',reminder:'11:30 AM、6:30 PM 提醒送货。'}
    };
    const defaultSettings = {
      people:["YN","PL","老板","小宝","MX","JX","Annie","Vivi","Calvin"],
      adminPeople:["老板","MX","Calvin"],adminPin:"8888",developerNotes:"",
      regularOff:{mon:[],tue:["YN"],wed:["PL"],thu:["JX"],fri:["Vivi"],sat:[],sun:["Annie","Calvin"]},
      extraAbsentByDate:{},
      rolePriorities:{billing:["YN","PL","老板","小宝"],instant:["MX","JX","PL","Vivi","小宝","Annie"],normal:["JX","MX","PL","Vivi","小宝","Annie"],packingVideo:["MX","Calvin","老板"],packingList:["Calvin","MX","老板"],delivery:["Calvin","老板"]},
      reminderTimes:{billing:["09:00","10:00","11:00","12:00","13:00","14:00","18:00"],instant:["09:05","10:05","11:05","12:05","13:05","14:05","18:05"],delivery:["11:30","18:30"]}
    };
    let urlParams = new URLSearchParams(window.location.search);
    let urlAdminPin = urlParams.get('admin') || urlParams.get('pin') || '';
    let urlAdminUser = urlParams.get('user') || '老板';
    let state = { tab:'today', selectedDay:'mon', settings: structuredClone(defaultSettings), selectedPerson: localStorage.getItem('turboSelectedPerson')||'', adminUser: '', adminLoginName:'老板', adminLoginPin:'', newEmployee:'', newReminder:{role:'billing',time:''}, now:new Date(), loading:false };
    let sb = null;
    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const clone = o => JSON.parse(JSON.stringify(o));
    function setStatus(msg,type=''){ statusEl.className = 'notice '+type; statusEl.textContent = msg; }
    function isFormActive(){ const el=document.activeElement; return el && ['INPUT','SELECT','TEXTAREA'].includes(el.tagName); }
    function shouldPauseAutoRender(){ return state.tab==='admin' || isFormActive(); }
    function mergeSettings(payload){ state.settings = {...clone(defaultSettings), ...(payload||{})}; state.settings.regularOff = {...defaultSettings.regularOff, ...(payload?.regularOff||{})}; state.settings.rolePriorities = {...defaultSettings.rolePriorities, ...(payload?.rolePriorities||{})}; state.settings.extraAbsentByDate = {...(payload?.extraAbsentByDate||{})}; state.settings.reminderTimes = {...defaultSettings.reminderTimes, ...(payload?.reminderTimes||{})}; }
    function todayParts(){ const parts = new Intl.DateTimeFormat('zh-MY',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()); const g=t=>parts.find(p=>p.type===t)?.value||''; const key = `${g('year')}-${g('month')}-${g('day')}`; const jsDay = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kuala_Lumpur'})).getDay(); const dayKey = ['sun','mon','tue','wed','thu','fri','sat'][jsDay]; return {date:key,weekday:g('weekday'),time:`${g('hour')}:${g('minute')}:${g('second')}`,dayKey}; }
    function moveToLast(list, person){ return list.includes(person) ? [...list.filter(p=>p!==person),person] : list; }
    function priority(role, absent, allPresent){ let list=[...(state.settings.rolePriorities?.[role]||[])]; if((role==='instant'||role==='normal')&&absent.has('YN')&&list.includes('PL')){ list=list.filter(p=>p!=='PL'); const i=list.indexOf('Annie'); i>=0?list.splice(i,0,'PL'):list.push('PL'); } if(allPresent) list=moveToLast(list,'小宝'); return list.filter(p=>!absent.has(p)); }
    function assignments(){ const s=state.settings, def=s.regularOff?.[state.selectedDay]||[], ex=s.extraAbsentByDate?.[todayParts().date]||[]; const absent=new Set([...def,...ex].filter(p=>s.people.includes(p))); const all=absent.size===0; const out={}; for(const k of Object.keys(roleMeta)){ const a=priority(k,absent,all); out[k]={available:a,main:a[0]||'无人可安排'}; } if(out.packingVideo.main && out.packingList.available[0]===out.packingVideo.main){ out.packingList.available=out.packingList.available.filter(p=>p!==out.packingVideo.main); out.packingList.main=out.packingList.available[0]||'无人可安排'; out.packingList.warn=true; } return {out, absent, def, ex, all}; }
    async function init(){ try{ if(!window.supabase) throw new Error('Supabase CDN 没有载入，请检查网络。'); sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); await load(true); sb.channel('ops_settings_web').on('postgres_changes',{event:'*',schema:'public',table:TABLE}, payload=>{ if(payload.new?.payload){ mergeSettings(payload.new.payload); if(!shouldPauseAutoRender()) render(); setStatus('已实时同步最新资料','ok'); }}).subscribe(); setInterval(()=>load(false),3000); setInterval(()=>{ state.now=new Date(); if(state.tab==='today' && !isFormActive()) render(); },1000); }catch(e){ console.error(e); setStatus('连接失败：'+e.message,'error'); render(); } }
    async function load(show=true){ if(!sb) return; try{ const {data,error}=await sb.from(TABLE).select('payload').eq('id',ID).maybeSingle(); if(error) throw error; if(!data){ await sb.from(TABLE).upsert({id:ID,payload:defaultSettings},{onConflict:'id'}); mergeSettings(defaultSettings); } else mergeSettings(data.payload); if(show) setStatus('已连接云端，所有手机使用同一份资料','ok'); if(!shouldPauseAutoRender()) render(); }catch(e){ console.error(e); setStatus('读取失败：'+e.message,'error'); } }
    async function savePatch(patch){ if(!sb){ alert('Supabase 未连接'); return; } state.loading=true; render(); try{ const {data:latest,error:loadError}=await sb.from(TABLE).select('payload').eq('id',ID).maybeSingle(); if(loadError) throw loadError; const latestPayload=latest?.payload||{}; let merged={...clone(defaultSettings),...latestPayload,...patch}; if(patch.extraAbsentByDate) merged.extraAbsentByDate={...(latestPayload.extraAbsentByDate||{}),...patch.extraAbsentByDate}; if(patch.regularOff) merged.regularOff={...(latestPayload.regularOff||{}),...patch.regularOff}; if(patch.rolePriorities) merged.rolePriorities={...(latestPayload.rolePriorities||{}),...patch.rolePriorities}; if(patch.reminderTimes) merged.reminderTimes={...(latestPayload.reminderTimes||{}),...patch.reminderTimes}; const {data,error}=await sb.from(TABLE).upsert({id:ID,payload:merged},{onConflict:'id'}).select('payload').single(); if(error) throw error; mergeSettings(data?.payload||merged); setStatus('保存成功，正在同步到所有手机','ok'); }catch(e){ alert('保存失败：'+e.message); setStatus('保存失败：'+e.message,'error'); } finally{ state.loading=false; render(); } }
    function isAdmin(){ return state.settings.adminPeople.includes(state.adminUser); }
    function setTab(t){ state.tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
    function render(doHtml=true){ if(!doHtml){} const now=todayParts(); const {out,absent,def,ex,all}=assignments(); if(state.selectedDay==='mon' && now.dayKey && !state._daySet){ state.selectedDay=now.dayKey; state._daySet=true; }
      if(state.tab==='today') renderToday(now,out,absent,def,ex,all); else if(state.tab==='me') renderMe(); else renderAdmin(now); }
    function renderToday(now,out,absent,def,ex,all){ app.innerHTML=`<h1 class="title">Daily Ops 每日负责人安排</h1><div class="sub">实时同步 · iOS / Android 通用 · Admin 可修改规则</div><div class="card"><div class="label">今日马来西亚日期</div><div class="big">${now.date} · ${now.weekday}</div><div class="big" style="margin-top:12px">${now.time}</div></div><div class="card"><div class="label">我的身份</div><div class="big">${esc(state.selectedPerson||'未选择')}</div><div class="muted">${isAdmin()?'Admin 模式':'员工 / 只读模式'}</div></div><div class="row">${days.map(d=>`<button class="day ${state.selectedDay===d.key?'active':''}" onclick="state.selectedDay='${d.key}';render()">${d.label}</button>`).join('')}</div>${all?'<div class="notice ok">全部人员到齐：小宝自动排最后</div>':''}<div class="section">当天没来 / 休息人员</div><div class="row">${state.settings.people.map(p=>`<span class="pill ${def.includes(p)?'fixed':ex.includes(p)?'absent':''}">${esc(p)} · ${def.includes(p)?'固定休息':ex.includes(p)?'临时没来':'有来'}</span>`).join('')}</div><div class="section">今日岗位</div><div class="roleGrid">${Object.keys(roleMeta).map(k=>roleCard(k,out[k])).join('')}</div>`; }
    function roleCard(k,a){ const rm=roleMeta[k]; const active=state.selectedPerson&&a.main===state.selectedPerson; return `<div class="card" style="${active?'border-color:#22c55e;box-shadow:0 0 0 2px #86efac':''}"><div class="label">负责岗位</div><div class="roleTitle">${rm.title}</div>${rm.reminder?`<div class="reminder">${rm.reminder} ${active?'当前岗位属于你，到点会提醒。':'若不是你的岗位，到点不会响。'}</div>`:''}<div class="mainPerson"><div class="label" style="color:#ccc">当天负责人</div><div class="name">${esc(a.main)}</div></div><div class="label">可用优先顺序</div>${a.available.map((p,i)=>`<div class="listItem"><b>${i+1}. ${esc(p)}</b>${i===0?'<span class="badge">负责人</span>':''}</div>`).join('')||'<div class="muted">没有可用人员，请手动安排。</div>'}</div>`; }
    function renderMe(){ app.innerHTML=`<h1 class="title">我的身份</h1><div class="sub">选择自己是谁，提醒只会针对你的岗位。</div><div class="row">${state.settings.people.map(p=>`<button class="pill ${state.selectedPerson===p?'active':''}" style="${state.selectedPerson===p?'background:#111;color:#fff':''}" onclick="state.selectedPerson='${esc(p)}';localStorage.setItem('turboSelectedPerson','${esc(p)}');renderMe()">${esc(p)}</button>`).join('')}</div><div style="margin-top:16px"><button class="btn light" onclick="state.selectedPerson='';localStorage.removeItem('turboSelectedPerson');renderMe()">清除身份</button></div>`; }
    function renderAdmin(now){ if(!isAdmin()){ app.innerHTML=`<h1 class="title">Admin 设置</h1><div class="sub">这个版本不使用输入框登入，避免手机浏览器刷新影响。请用 Admin 专属链接进入。</div><div class="card"><div class="label">Admin 专属链接</div><div class="notice">请打开：<br><b>https://turboklmy-bit.github.io/turbo-daily-ops/?admin=8888</b><br><br>打开后会直接进入老板 Admin 模式。</div><button class="btn" onclick="location.href='?admin=8888&v=4'">用 Admin 模式重新打开</button></div>`; return; }
      const s=state.settings, ex=s.extraAbsentByDate?.[now.date]||[]; app.innerHTML=`<h1 class="title">Admin 设置</h1><div class="sub">当前 Admin：${esc(state.adminUser)}</div><button class="btn danger" onclick="logoutAdmin()">退出 Admin</button><div class="section">今天临时没来</div><div class="row">${s.people.map(p=>`<button class="pill ${ex.includes(p)?'absent':''}" onclick="toggleExtra('${esc(p)}')">${esc(p)}${ex.includes(p)?' · 临时没来':''}</button>`).join('')}</div><div class="section">员工名单</div><div class="adminBox"><div class="grid2"><input id="newEmp" class="input" placeholder="输入员工名字"><button class="btn" onclick="addEmployee()">添加</button></div>${s.people.map(p=>`<div class="listItem"><b>${esc(p)}</b><button class="btn danger" onclick="deleteEmployee('${esc(p)}')">删除</button></div>`).join('')}</div><div class="section">固定休息设置</div>${days.map(d=>`<div class="adminBox"><h3>${d.label}</h3><div class="row">${s.people.map(p=>`<button class="pill ${(s.regularOff?.[d.key]||[]).includes(p)?'active':''}" style="${(s.regularOff?.[d.key]||[]).includes(p)?'background:#111;color:#fff':''}" onclick="toggleRegular('${d.key}','${esc(p)}')">${esc(p)}</button>`).join('')}</div></div>`).join('')}<div class="section">岗位优先顺序</div>${Object.keys(roleMeta).map(k=>priorityEditor(k)).join('')}<div class="section">提醒时间</div><div class="adminBox"><div class="grid2"><select class="input" id="remRole">${Object.keys(roleMeta).map(k=>`<option value="${k}">${roleMeta[k].title}</option>`).join('')}</select><input class="input" id="remTime" placeholder="例如 09:00"></div><button class="btn" style="margin-top:10px" onclick="addReminder()">添加提醒时间</button>${Object.entries(s.reminderTimes||{}).map(([k,times])=>`<h3>${roleMeta[k]?.title||k}</h3><div class="row">${(times||[]).map(t=>`<button class="pill" onclick="removeReminder('${k}','${t}')">${t} ×</button>`).join('')}</div>`).join('')}</div><div class="section">开发备注 / 规则修改需求</div><textarea class="input" rows="5" onchange="savePatch({developerNotes:this.value})">${esc(s.developerNotes||'')}</textarea>`; }
    function priorityEditor(k){ const list=state.settings.rolePriorities?.[k]||[]; const canAdd=state.settings.people.filter(p=>!list.includes(p)); return `<div class="prioCard"><h3>${roleMeta[k].title}</h3>${list.map((p,i)=>`<div class="priorityRow"><span>${i+1}.</span><b>${esc(p)}</b><button class="btn light" onclick="movePrio('${k}',${i},-1)">↑</button><button class="btn light" onclick="movePrio('${k}',${i},1)">↓</button><button class="btn danger" onclick="removePrio('${k}','${esc(p)}')">删</button></div>`).join('')}<div class="row" style="margin-top:10px">${canAdd.map(p=>`<button class="smallBtn" onclick="addPrio('${k}','${esc(p)}')">+ ${esc(p)}</button>`).join('')}</div></div>`; }
    window.promptAdminLogin=(name)=>{ const pin = window.prompt('请输入 '+name+' 的 Admin PIN'); if(pin===null) return; if(state.settings.adminPeople.includes(name) && String(pin).trim()===String(state.settings.adminPin)){ state.adminUser=name; state.adminLoginName=name; state.adminLoginPin=''; localStorage.setItem('turboAdminUser',state.adminUser); renderAdmin(todayParts()); } else { alert('Admin PIN 不正确'); } };
    window.loginAdmin=()=>{ const pin=window.prompt('请输入 Admin PIN'); if(pin===null) return; const name=state.adminLoginName||state.settings.adminPeople[0]; if(state.settings.adminPeople.includes(name)&&String(pin).trim()===String(state.settings.adminPin)){ state.adminUser=name; state.adminLoginPin=''; localStorage.setItem('turboAdminUser',state.adminUser); renderAdmin(todayParts()); } else alert('Admin 或 PIN 不正确'); };
    window.logoutAdmin=()=>{ state.adminUser=''; localStorage.removeItem('turboAdminUser'); urlAdminPin=''; history.replaceState(null,'',location.pathname+'?v=4'); renderAdmin(todayParts()); };
    window.toggleExtra=(p)=>{ const date=todayParts().date; const cur=state.settings.extraAbsentByDate?.[date]||[]; const next=cur.includes(p)?cur.filter(x=>x!==p):[...cur,p]; savePatch({extraAbsentByDate:{[date]:next}}); };
    window.addEmployee=()=>{ const v=document.getElementById('newEmp').value.trim(); if(!v||state.settings.people.includes(v)) return; savePatch({people:[...state.settings.people,v]}); };
    window.deleteEmployee=(p)=>{ if(!confirm('确定删除 '+p+'？')) return; const people=state.settings.people.filter(x=>x!==p); const regularOff={}; for(const d of days) regularOff[d.key]=(state.settings.regularOff?.[d.key]||[]).filter(x=>x!==p); const rolePriorities={}; for(const k of Object.keys(roleMeta)) rolePriorities[k]=(state.settings.rolePriorities?.[k]||[]).filter(x=>x!==p); savePatch({people,regularOff,rolePriorities}); };
    window.toggleRegular=(d,p)=>{ const cur=state.settings.regularOff?.[d]||[]; const next=cur.includes(p)?cur.filter(x=>x!==p):[...cur,p]; savePatch({regularOff:{[d]:next}}); };
    window.movePrio=(k,i,dir)=>{ const list=[...(state.settings.rolePriorities?.[k]||[])]; const j=i+dir; if(j<0||j>=list.length)return; [list[i],list[j]]=[list[j],list[i]]; savePatch({rolePriorities:{[k]:list}}); };
    window.removePrio=(k,p)=>{ savePatch({rolePriorities:{[k]:(state.settings.rolePriorities?.[k]||[]).filter(x=>x!==p)}}); };
    window.addPrio=(k,p)=>{ savePatch({rolePriorities:{[k]:[...(state.settings.rolePriorities?.[k]||[]),p]}}); };
    window.addReminder=()=>{ const k=document.getElementById('remRole').value,t=document.getElementById('remTime').value.trim(); if(!/^\d{2}:\d{2}$/.test(t)) return alert('时间格式请写 09:00'); const list=state.settings.reminderTimes?.[k]||[]; if(!list.includes(t)) savePatch({reminderTimes:{[k]:[...list,t].sort()}}); };
    window.removeReminder=(k,t)=>{ savePatch({reminderTimes:{[k]:(state.settings.reminderTimes?.[k]||[]).filter(x=>x!==t)}}); };
    init();
  </script>
</body>
</html>
